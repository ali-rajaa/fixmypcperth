<!-- Shared behaviour: scroll bar, hamburger toggle, GA4 click tracking. -->
<script>
/* ============================================================
   GA4 conversion helpers.
   These three are called from onclick attributes throughout the
   site but were defined nowhere, so every WhatsApp tap threw
   "trackWAClick is not defined" and no conversion has ever been
   recorded. Declared globally and ahead of everything else so
   they exist before the first click can happen. Guarded on gtag
   so they stay harmless if the tag is blocked.
   ============================================================ */
function trackPhoneClick() {
  if (typeof gtag === 'function') {
    gtag('event', 'phone_call_click', { event_category: 'engagement', event_label: 'phone' });
  }
}
function trackWAClick() {
  if (typeof gtag === 'function') {
    gtag('event', 'whatsapp_click', { event_category: 'engagement', event_label: 'whatsapp' });
  }
}
function trackQuoteForm() {
  if (typeof gtag === 'function') {
    gtag('event', 'quote_form_click', { event_category: 'engagement', event_label: 'quote_form' });
  }
}
/* One lead event for every quote and audit form, named by form, so a
   send is never counted as a button click. Mark generate_lead as a key
   event in Google Analytics to see sends per form under conversions. */
function trackLead(formName) {
  if (typeof gtag === 'function') {
    gtag('event', 'generate_lead', { form_name: formName, page_path: location.pathname });
  }
}

/* ============================================================
   Submit button states, shared by every quote and audit form:
   Send > Sending (spinner) > Sent (tick) > the form's own
   confirmation. Styled in shell.css. formSending keeps the
   button's original markup so formReset can put the label and
   its icon back exactly after a failed send (restoring with
   textContent used to drop the arrow icon). formSent holds the
   tick on screen briefly so the change reads, then runs `then`.
   formShow reveals a confirmation with the shared fade and lift.
   ============================================================ */
function formSending(btn) {
  if (!btn.hasAttribute('data-label')) btn.setAttribute('data-label', btn.innerHTML);
  btn.style.minWidth = btn.offsetWidth + 'px';
  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  btn.classList.remove('is-sent');
  btn.classList.add('is-sending');
  btn.innerHTML = '<span class="btn-state"><span class="btn-spin" aria-hidden="true"></span>Sending</span>';
}
function formSent(btn, then) {
  btn.classList.remove('is-sending');
  btn.classList.add('is-sent');
  btn.removeAttribute('aria-busy');
  btn.innerHTML = '<span class="btn-state"><svg class="btn-tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12 9 17 20 6"/></svg>Sent</span>';
  setTimeout(then, 700);
}
function formReset(btn) {
  btn.classList.remove('is-sending', 'is-sent');
  btn.removeAttribute('aria-busy');
  btn.disabled = false;
  btn.style.minWidth = '';
  if (btn.hasAttribute('data-label')) btn.innerHTML = btn.getAttribute('data-label');
}
function formShow(el) {
  el.hidden = false;
  el.classList.add('rise-in');
}

(function () {
  'use strict';

  /* ---- Reveal on scroll ----
     Runs FIRST, before anything else can throw. It adds the `js` class
     itself, so the hidden state is only ever applied once the observer
     that undoes it is confirmed working. If this block fails, the page
     stays fully visible. */
  try {
    const fadeEls = document.querySelectorAll('.fade-up');
    if (fadeEls.length && 'IntersectionObserver' in window) {
      const obs = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry, i) {
          if (entry.isIntersecting) {
            setTimeout(function() { entry.target.classList.add('in'); }, i * 60);
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08 });
      document.documentElement.classList.add('js');
      fadeEls.forEach(function(el) { obs.observe(el); });
    }
  } catch (e) {
    document.documentElement.classList.remove('js');
  }

  /* ---- Scroll Progress Bar ---- */
  const bar = document.getElementById('scroll-bar');
  if (bar) {
    window.addEventListener('scroll', function() {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.transform = 'scaleX(' + (window.scrollY / h) + ')';
    }, { passive: true });
  }

  /* ---- Trust Ticker ---- */
  const items = [
    'Same or next day turnaround',
    'Local drop off in Canning Vale',
    '30-day warranty on all work',
    'Upfront pricing, agreed before we start',
    'No fix, no fee on data recovery',
    'Rated {{ site.data.reviews.meta.rating }} on Google',
    'Free quote in minutes',
    'Open 24 hours, 7 days',
    'Gaming PC builds &amp; upgrades',
    'Virus &amp; malware removal {% include price.html key="virus-malware-removal" bare=true raw=true %}',
    'Laptop screen replacement Perth',
    'SSD upgrades from {% include price.html key="ssd-upgrade-labour-only" bare=true raw=true %}',
    'Business IT support from {% include price.html key="business-it-essential" bare=true raw=true %}/mo',
  ];
  const track = document.getElementById('trust-track');
  if (track) {
    const doubled = [...items, ...items];
    track.innerHTML = doubled.map(function(t) {
      return '<div class="trust-item"><div class="trust-dot" aria-hidden="true"></div>' + t + '</div>';
    }).join('');
  }


  /* ---- Mobile Hamburger ---- */
  const hamburger = document.getElementById('mob-hamburger');
  const mobMenu   = document.getElementById('mob-menu');

  if (hamburger && mobMenu) {

  /* One place that sets the state, so the class, the ARIA and the label can
     never drift apart. Previously each of the three close paths repeated the
     same four lines, and a fourth path (Escape) was missing entirely. */
  function setMenu(isOpen) {
    mobMenu.classList.toggle('open', isOpen);
    hamburger.classList.toggle('open', isOpen);
    hamburger.setAttribute('aria-expanded', String(isOpen));
    hamburger.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
    /* Fold Repairs once the panel has faded out, not while it is visible. */
    if (!isOpen) setTimeout(function() {
      if (!mobMenu.classList.contains('open') && typeof setRep === 'function') setRep(false);
    }, 240);
  }

  hamburger.addEventListener('click', function() {
    setMenu(!mobMenu.classList.contains('open'));
  });

  mobMenu.querySelectorAll('a.mob-link').forEach(function(link) {
    link.addEventListener('click', function() { setMenu(false); });
  });

  document.addEventListener('click', function(e) {
    if (mobMenu.classList.contains('open') && !mobMenu.contains(e.target) && !hamburger.contains(e.target)) {
      setMenu(false);
    }
  });

  /* Escape closes the menu and returns focus to the button that opened it.
     Without this a keyboard user who opened the menu had no way to dismiss it. */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && mobMenu.classList.contains('open')) {
      setMenu(false);
      hamburger.focus();
    }
  });

  /* The hamburger is hidden above 900px. If the menu was open and the viewport
     crossed that breakpoint (rotating a phone to landscape, resizing a window),
     the panel was left on screen with no control able to close it. */
  var deskQuery = window.matchMedia('(min-width: 901px)');
  var onBreakpoint = function(e) { if (e.matches) setMenu(false); };
  if (deskQuery.addEventListener) { deskQuery.addEventListener('change', onBreakpoint); }
  else if (deskQuery.addListener) { deskQuery.addListener(onBreakpoint); }

  }

  /* Phone menu: Repairs starts closed, so the menu opens short. Its heading
     unfolds the list in place. inert keeps the folded links out of the tab
     order and away from screen readers. Closing the whole menu folds it
     again, so the next open starts the same way. */
  var mobRepBtn = document.getElementById('mob-repairs-btn');
  var mobRep = document.getElementById('mob-repairs');
  var setRep = function(open) {
    if (!mobRepBtn || !mobRep) return;
    mobRepBtn.setAttribute('aria-expanded', String(open));
    mobRep.classList.toggle('open', open);
    if (open) mobRep.removeAttribute('inert'); else mobRep.setAttribute('inert', '');
  };
  if (mobRepBtn && mobRep) {
    mobRepBtn.addEventListener('click', function() {
      setRep(mobRepBtn.getAttribute('aria-expanded') !== 'true');
    });
  }

  /* ---- Header Repairs menu (desktop) ----
     With a mouse it opens on hover and closes a moment after the pointer
     leaves (the delay lets the pointer cross the gap or cut a corner without
     the menu snapping shut). A mouse click on the button keeps it open
     rather than toggling it shut under the pointer. Keyboard and touch open
     it on click / Enter. Escape, a click outside, Tab past the last link or
     crossing to the phone layout all close it. Down arrow from the button
     moves into the list; Up and Down move through it. */
  var ddBtn = document.getElementById('nav-dd-btn');
  var ddPanel = document.getElementById('nav-dd-panel');
  if (ddBtn && ddPanel) {
    var ddLinks = function() { return Array.prototype.slice.call(ddPanel.querySelectorAll('a')); };
    /* The panel stays in the page and animates both ways (shell.css), so a
       second click mid-opening reverses it from where it is. */
    var ddOpen = function() { return ddPanel.classList.contains('open'); };
    var setDd = function(open) {
      ddPanel.classList.toggle('open', open);
      ddBtn.setAttribute('aria-expanded', String(open));
    };
    var ddWrap = ddBtn.parentNode, ddTimer, lastPointer = '';
    ddWrap.addEventListener('pointerenter', function(e) {
      if (e.pointerType !== 'mouse') return;
      clearTimeout(ddTimer); ddTimer = setTimeout(function() { setDd(true); }, 60);
    });
    ddWrap.addEventListener('pointerleave', function(e) {
      if (e.pointerType !== 'mouse') return;
      clearTimeout(ddTimer); ddTimer = setTimeout(function() { setDd(false); }, 220);
    });
    ddBtn.addEventListener('pointerdown', function(e) { lastPointer = e.pointerType; });
    ddBtn.addEventListener('click', function(e) {
      clearTimeout(ddTimer);
      if (e.detail > 0 && lastPointer === 'mouse') { setDd(true); return; }
      setDd(!ddOpen());
    });
    ddBtn.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setDd(true); ddLinks()[0].focus(); }
    });
    ddPanel.addEventListener('keydown', function(e) {
      var links = ddLinks(), i = links.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); links[Math.min(i + 1, links.length - 1)].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (i <= 0) ddBtn.focus(); else links[i - 1].focus(); }
    });
    document.addEventListener('click', function(e) {
      if (ddOpen() && !ddPanel.contains(e.target) && !ddBtn.contains(e.target)) setDd(false);
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && ddOpen()) { setDd(false); ddBtn.focus(); }
    });
    ddBtn.parentNode.addEventListener('focusout', function(e) {
      if (e.relatedTarget && !ddBtn.parentNode.contains(e.relatedTarget)) setDd(false);
    });
    var phoneQuery = window.matchMedia('(max-width: 900px)');
    var onPhone = function(e) { if (e.matches) setDd(false); };
    if (phoneQuery.addEventListener) { phoneQuery.addEventListener('change', onPhone); }
    else if (phoneQuery.addListener) { phoneQuery.addListener(onPhone); }
  }

  /* Marks the header links for the page being viewed. */
  var here = location.pathname.replace(/\.html$/, '').replace(/\/$/, '') || '/';
  document.querySelectorAll('.desk-nav a, .mob-menu a').forEach(function(a) {
    if (a.getAttribute('href').charAt(0) === '#') return;
    var p = a.pathname.replace(/\.html$/, '').replace(/\/$/, '') || '/';
    if (p === here && p !== '/') a.setAttribute('aria-current', 'page');
  });

  /* ---- FAQ Accordion ---- */
  /* Every FAQ on the site is the same .faq-item / .faq-q / .faq-a markup
     (see the FAQ block in any page stylesheet), so this one handler runs
     them all. One answer open at a time. */
  document.querySelectorAll('.faq-q').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var item = btn.closest('.faq-item');
      var isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item').forEach(function(i) {
        i.classList.remove('open');
        i.querySelector('.faq-q').setAttribute('aria-expanded', 'false');
      });
      if (!isOpen) {
        item.classList.add('open');
        btn.setAttribute('aria-expanded', 'true');
      }
    });
  });

  /* ---- Footer sections (phones) ----
     On phones Repairs, Company and Suburbs collapse behind their headings
     (shell.css, max-width 760px). The class is only added here, so with no
     JavaScript every list simply shows. Wider screens never hide anything. */
  (function () {
    var ft = document.querySelector('footer');
    if (!ft) return;
    var secs = ft.querySelectorAll('.footer-sec');
    if (!secs.length) return;
    ft.classList.add('footer-js');
    secs.forEach(function (sec) {
      var btn = sec.querySelector('.footer-sec-btn');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var open = !sec.classList.contains('open');
        sec.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', String(open));
      });
    });
  })();

  /* ---- Phone click tracking ---- */
  document.querySelectorAll('a[href^="tel:"]').forEach(function(el) {
    el.addEventListener('click', function() { if(typeof trackPhoneClick==='function') trackPhoneClick(); });
  });

  /* ---- Same-day cutoff countdown (2pm Perth time) ---- */
  (function() {
    const box  = document.getElementById('mqCountdown');
    const text = document.getElementById('mqCountdownText');
    if (!box || !text) return;

    function tick() {
      // Perth is UTC+8 with no daylight saving, so work out Perth local time
      // regardless of where the visitor is.
      const nowUtc = new Date();
      const perth  = new Date(nowUtc.getTime() + (8 * 60 + nowUtc.getTimezoneOffset()) * 60000);

      // 2pm Perth on the same day. If we are past it, the cutoff has gone.
      const cutoff = new Date(perth.getTime());
      cutoff.setHours(14, 0, 0, 0);
      const diff = cutoff.getTime() - perth.getTime();

      if (diff > 0) {
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        // Hours and minutes while there is over an hour left, minutes and
        // seconds inside the last hour, so it reads as live without spending
        // all day counting seconds nobody is watching.
        const left = h > 0 ? (h + 'h ' + m + 'm') : (m + 'm ' + s + 's');
        box.classList.remove('closed');
        text.innerHTML = 'Drop off within <span class="mq-notice-time">' + left + '</span> for same day pickup.';
      } else {
        box.classList.add('closed');
        text.textContent = 'Drop off tonight, first on the bench tomorrow.';
      }
    }
    tick();
    box.classList.add('ready');
    setInterval(tick, 1000);
  })();

  /* ---- Sticky mobile CTA bar ---- */
  (function() {
    const bar = document.getElementById('stickyCta');
    if (!bar) return;
    /* "Get a quote": this page's own form if it has one, else /quote-request. */
    const quoteBtn = bar.querySelector('.sc-quote');
    if (quoteBtn) {
      const local = document.getElementById('top-quote') || document.getElementById('quote');
      quoteBtn.setAttribute('href', local ? '#' + local.id : '/quote-request');
    }
    const hero = document.querySelector('.hero, .quiz-hero');
    window.addEventListener('scroll', function() {
      const past = hero ? (window.scrollY > hero.offsetHeight * 0.85) : (window.scrollY > 600);
      bar.classList.toggle('show', past);
    }, { passive: true });

    /* Slide the bar away once the footer scrolls into view, and back when
       it leaves. A separate class rather than toggling .show, so it cannot
       clash with the .show toggle above. */
    const footer = document.querySelector('footer');
    if (footer && 'IntersectionObserver' in window) {
      new IntersectionObserver(function(entries) {
        const atFooter = entries[0].isIntersecting;
        bar.classList.toggle('at-footer', atFooter);
        bar.inert = atFooter;
      }).observe(footer);
    }
  })();

  /* ---- Package carousel dots (mobile) ---- */
  (function() {
    const duo  = document.getElementById('pkgDuo');
    const dots = document.getElementById('pkgDots');
    if (!duo || !dots) return;

    const buttons = Array.from(dots.querySelectorAll('.pkg-dot'));
    const cards   = Array.from(duo.querySelectorAll('.pkg-card'));

    function sync() {
      if (window.getComputedStyle(duo).overflowX !== 'auto') return;
      const mid = duo.scrollLeft + duo.clientWidth / 2;
      let active = 0, best = Infinity;
      cards.forEach(function(card, i) {
        const c = card.offsetLeft + card.offsetWidth / 2;
        const d = Math.abs(c - mid);
        if (d < best) { best = d; active = i; }
      });
      buttons.forEach(function(b, i) { b.classList.toggle('active', i === active); });
    }

    duo.addEventListener('scroll', function() {
      window.requestAnimationFrame(sync);
    }, { passive: true });

    buttons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        const card = cards[parseInt(btn.dataset.i, 10)];
        if (card) duo.scrollTo({ left: card.offsetLeft - duo.offsetLeft, behavior: 'smooth' });
      });
    });

    sync();
  })();

  /* ---- Homepage quote card (Web3Forms, 2 steps) ----
     Step 1 is the service. A tap on a service moves straight to step 2;
     arrow keys only change the choice, and Continue moves on, so a
     keyboard user is never thrown forward. Step 2 is the machine, then
     where to reply: the reply choice shows only the mobile or the email
     field. Same fields and messages as _includes/quote-form.html. */
  (function() {
    const form = document.getElementById('miniQuoteForm');
    if (!form) return;

    const $ = function(id) { return document.getElementById(id); };
    const success = $('mqSuccess'), submitBtn = $('mqSubmitBtn'), nextBtn = $('mqNextBtn');
    const step1 = $('mqStep1'), step2 = $('mqStep2'), fill = $('mqProgressFill'), label = $('mqProgressLabel');
    const trust = document.querySelector('.mq-trust');
    const phone = $('mq-phone'), email = $('mq-email'), errEl = $('mqErr');
    const phoneRe = /^(\+?61|0)[2-478]\d{8}$/;
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function selected() {
      const el = form.querySelector('input[name="Service"]:checked');
      return el ? el.value : '';
    }
    function byEmail() {
      const c = form.querySelector('input[name="Preferred Contact"]:checked');
      return !!c && c.value === 'Email';
    }
    const checks = {
      'mq-service': function() { return !!selected(); },
      'mq-device':  function() { return !!form.querySelector('input[name="Device Type"]:checked'); },
      'mq-name':    function(v) { return v.trim().length > 0; },
      'mq-phone':   function(v) { return byEmail() || phoneRe.test(v.replace(/[\s().-]/g, '')); },
      'mq-email':   function(v) { return !byEmail() || emailRe.test(v.trim()); }
    };
    function check(id) {
      const el = $(id);
      const ok = checks[id](el.value || '');
      el.setAttribute('aria-invalid', ok ? 'false' : 'true');
      $(id + '-err').hidden = ok;
      return ok;
    }

    function goStep(n) {
      const two = (n === 2);
      step1.classList.toggle('active', !two);
      step2.classList.toggle('active', two);
      fill.style.width = two ? '100%' : '50%';
      label.textContent = 'Step ' + n + ' of 2';
      if (two) {
        $('mqSelectedName').textContent = selected();
        const first = form.querySelector('input[name="Device Type"]:checked') || form.querySelector('input[name="Device Type"]');
        if (first) first.focus({ preventScroll: true });
      } else {
        const svc = form.querySelector('input[name="Service"]:checked') || form.querySelector('input[name="Service"]');
        if (svc) svc.focus({ preventScroll: true });
      }
    }

    /* A pointer tap on a service advances; a keyboard change does not. */
    let tapped = 0;
    $('mq-service').addEventListener('pointerdown', function() { tapped = Date.now(); });
    form.querySelectorAll('input[name="Service"]').forEach(function(r) {
      r.addEventListener('change', function() {
        check('mq-service');
        if (Date.now() - tapped < 1500) setTimeout(function() { goStep(2); }, 180);
      });
    });
    nextBtn.addEventListener('click', function() { if (check('mq-service')) goStep(2); });
    $('mqBackBtn').addEventListener('click', function() { goStep(1); });

    function syncContact() {
      const mail = byEmail();
      $('mq-phone-f').hidden = mail;
      $('mq-email-f').hidden = !mail;
      phone.disabled = mail;
      email.disabled = !mail;
      const off = mail ? 'mq-phone' : 'mq-email';
      $(off).setAttribute('aria-invalid', 'false');
      $(off + '-err').hidden = true;
    }
    form.querySelectorAll('input[name="Preferred Contact"]').forEach(function(r) { r.addEventListener('change', syncContact); });
    form.querySelectorAll('input[name="Device Type"]').forEach(function(r) { r.addEventListener('change', function() { check('mq-device'); }); });
    ['mq-name', 'mq-phone', 'mq-email'].forEach(function(id) {
      const el = $(id);
      el.addEventListener('blur', function() { if (el.value) check(id); });
      el.addEventListener('input', function() { if (el.getAttribute('aria-invalid') === 'true') check(id); });
    });
    syncContact();

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errEl.hidden = true;
      if (!check('mq-service')) { goStep(1); return; }
      const bad = ['mq-device', 'mq-name', 'mq-phone', 'mq-email'].filter(function(id) { return !check(id); });
      if (bad.length) {
        const first = $(bad[0]);
        (first.tagName === 'FIELDSET' ? first.querySelector('input') : first).focus();
        return;
      }
      formSending(submitBtn);
      const data = {};
      new FormData(form).forEach(function(v, k) { data[k] = v; });
      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(data)
      }).then(function(r) { return r.json(); }).then(function(res) {
        if (!res.success) throw new Error(res.message || 'failed');
        formSent(submitBtn, function() {
          form.hidden = true;
          if (trust) trust.hidden = true;
          $('mqDoneHow').textContent = byEmail() ? 'email' : 'WhatsApp';
          formShow(success);
          success.setAttribute('tabindex', '-1');
          success.focus();
          trackLead('quote_home');
        });
      }).catch(function() {
        formReset(submitBtn);
        errEl.hidden = false;
      });
    });
  })();

})();
</script>
