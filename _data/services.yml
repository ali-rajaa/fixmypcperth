# ==========================================================
# services.yml   THE MASTER PRICE LIST
#
# This file is the single source of truth for every price on
# the site. Change a number here and it changes on the pricing
# page, in the schema Google reads, and on any other page that
# pulls the same key. Nothing is hardcoded anywhere else.
#
# ----------------------------------------------------------
# ADDING A NEW SERVICE
#
#   - key:      a unique slug, lowercase and hyphenated.
#               This is the handle other pages use, so once a
#               key is live do not rename it.
#     category: must match a category id below. If it does
#               not match one, the service will not appear.
#     group:    must match one of that category's groups. Use
#               ~ for no group.
#     name:     what the customer sees.
#     desc:     one or two sentences.
#     price:    a plain number. No dollar sign, no quotes.
#
# Optional on any service:
#     prefix:   "from"      renders as "from $150"
#     plus:     true        renders as "+$40"
#     suffix:   "all-in"    renders as "$120 all-in"
#     alt:      second line under the price
#     badge:    small label beside the name
#     text:     use instead of price for "Free" or "Custom"
#     chips:    list of symptom words, shown as tags
#     options:  list of tiers, each with name and price
#     page:     service page slug /services links this row to, when
#               the automatic match (see services.html) picks wrong
#
# ----------------------------------------------------------
# CHANGING A PRICE
#
#   Edit the number. That is the whole job. Counts, totals,
#   the category rail and the JSON-LD offers are all derived,
#   so nothing else needs touching.
#
# ----------------------------------------------------------
# ADDING A CATEGORY
#
#   Add an entry under categories with a new id, then add an
#   icon of the same name to _includes/svc-icon.html.
#
# ----------------------------------------------------------
# THE ONLY THREE PLACES A PRICE IS STILL TYPED BY HAND
#
# Jekyll cannot run an include inside front matter, so these
# three strings do not follow this file. If you change the
# diagnostic fee, edit them too:
#
#   index.html      title:        "... Flat $120 All-In ..."
#   index.html      description:  "... a flat $120 covers ..." (uses [[keys]])
#   pricing.html    description:  "... $120 all-in, virus $99 ..." (uses [[keys]])
#
# Everything else on the site updates itself.
# ----------------------------------------------------------
#
# Never rename this file to site.yml, page.yml, layout.yml or
# content.yml. Those names collide with Jekyll's own objects.
# ==========================================================

