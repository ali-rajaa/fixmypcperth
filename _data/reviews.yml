# Customer reviews and the headline rating.
#
# The rating lives here, not in any page. The old reviews page hardcoded
# "5.0 across 200+ verified reviews" into the copy, the title tag and an
# AggregateRating schema block. The Google Business Profile is 4.8 from
# about 37, so the page was claiming something checkable in one click.
#
# Update meta.rating and meta.review_count here when the profile changes.
# No page should ever contain a hardcoded rating or review count.
#
# Prices in the FAQ are written as [[service-key]] tokens, never as figures.
# The page resolves them through _includes/resolve-prices.html, so every
# number comes from _data/services.yml and cannot go stale in the copy.
#
# They used to be written as {% include price.html %} calls. Jekyll does not
# run Liquid inside _data, so those rendered as literal characters on the
# page and inside the FAQ schema. Do not put Liquid in this file.

meta:
  rating: 4.8
  review_count: 47
  source: Google Business Profile
  # Links to the Google Business Profile, all built on its Place ID, which
  # Google keeps stable. Copied Google Maps addresses (the long /maps/place/
  # ...@-32.06,115.92,17z/data=... kind) are not stable: they carry map
  # coordinates and open a pin or a search rather than the listing. Every
  # page reads these three, so a change is one edit here.
  #
  # profile_url and reviews_url use Google's Maps URLs format
  # (maps/search/?api=1 with query_place_id): on a phone it opens the
  # Google Maps app at the listing, where the reviews are; on a computer,
  # Google Maps in the browser. Maps has no link straight to its reviews
  # tab, so the two are the same. Writing a review has no Maps app link,
  # so write_review_url opens Google's review box in the browser.
  place_id: ChIJQxKYICCXMioRFw4BqZ15Mz0
  profile_url: https://www.google.com/maps/search/?api=1&query=FixMyPC%20Perth&query_place_id=ChIJQxKYICCXMioRFw4BqZ15Mz0
  reviews_url: https://www.google.com/maps/search/?api=1&query=FixMyPC%20Perth&query_place_id=ChIJQxKYICCXMioRFw4BqZ15Mz0
  write_review_url: https://search.google.com/local/writereview?placeid=ChIJQxKYICCXMioRFw4BqZ15Mz0
  note: Rating and count are the live Google Business Profile figures. Update them here only; every page reads from
    this file.
# Real Google reviews, copied word for word (owner supplied, October 2026).
# First names only, per the privacy policy. No dates: Google's "3 months
# ago" goes stale. The first one is the featured review on /reviews.
# The homepage row and /reviews both show every entry.
