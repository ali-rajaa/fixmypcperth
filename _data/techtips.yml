# Tech Tips post index.
# Drives /tech-tips. Jekyll renders real anchors from this at build time;
# the old blog built its list in JavaScript, so no post link was crawlable.
#
# EDITORIAL RULE FOR EVERY POST HERE:
# explain what a symptom means, how urgent it is and what it costs.
# Never explain how to fix it. No tool names to download, no settings to
# change, no steps to follow. A reader who is walked through the repair does
# not book, and on a failing drive the DIY attempt usually destroys data that
# was still recoverable.
#
# REMOVED: how-to-fix-a-slow-computer. It was the explicit DIY guide (10
# self-fix steps) and it targeted the same query as why-is-my-pc-so-slow,
# so the two competed for the same rankings. Needs a 301 to
# /tech-tips/why-is-my-pc-so-slow.
#
# MERGED: data-recovery-perth-guide. It targeted "data recovery Perth",
# the data recovery service page's own keyword, so the two would compete.
# Its content folds into signs-hard-drive-failing. Needs a 301 to
# /tech-tips/signs-hard-drive-failing.
#
# EDITORIAL RULE, tightened: a guide never helps the reader diagnose their
# own machine. It explains what a cause is, how urgent it is and what it
# costs. No signs that tell one cause from another, no checks, no steps.

meta:
  base: /tech-tips
# built: true means the page exists at /tech-tips/<slug>. The hub lists
# every post here whether or not it is built.
#
# related: the three guides shown under "More Tech Tips" at the foot of
# this guide, in order. Chosen by topic, not date, so every guide is linked
# from at least two others (by date the oldest guide was never linked from
# any). Without it the layout falls back to the three newest guides.
