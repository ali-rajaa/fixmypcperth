<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url | remove: '.html' }}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  <meta property="og:type" content="{{ page.og_type | default: 'website' }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | remove: '.html' }}">
  <meta property="og:image" content="{{ site.url }}/logo.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/favicon.png">
  <meta name="theme-color" content="#0F172A">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Page stylesheet first, shared chrome last so the header always wins -->
  {% if page.page_css %}<link rel="stylesheet" href="{{ page.page_css }}">{% endif %}
  <link rel="stylesheet" href="/assets/css/shell.css">

  {%- if page.schemas %}{% for sc in page.schemas %}
  <script type="application/ld+json">{{ sc }}</script>
  {%- endfor %}{% endif %}

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S0CW1QXBDY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S0CW1QXBDY');
  </script>
</head>
<body>

{% include header.html %}

<main id="main-content">
{{ content }}
</main>

{% include footer.html %}
{% include sticky-cta.html %}

</body>
</html>
